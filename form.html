<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 style="text-align: center;">Registration Form</h1>
    <form style="width:300px;border-radius: 10px; padding: 15px;margin: auto;background-color: mistyrose;"">
        Name:<input type="text" name="name"><br><br>
        Email:<input type="email" name="email"><br><br>
        Password:<input type="password" name="password"><br><br>
        Gender:
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        
        <br><br>
        Hobbies:
        <input type="checkbox" name="hobbies" value="Playing">Playing
        <input type="checkbox"name="hobbies" value="Listening Music">Listening Music
        
        <br><br>
        <center><button type="submit">Submit</button></center>
        

    </form>
</body>
</html>
